name: Continuous Integration

on:
  push:
    # CI runs on every push to main, including the merge of the Version PR.
    # release.yml also runs on that same push (in parallel) to publish if a
    # version bump is detected. They use the same SHA and never block each
    # other; release.yml does NOT re-run tests, it trusts that branch
    # protection ensured CI passed before the merge.
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: GITHUB_TOKEN can only read repo contents and PR metadata.
# Secrets (NPM_TOKEN, App private key) are never in scope for pull_request
# from forks.
permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Trust boundary: bot accounts whose commits are exempt from human-identity
  # checks (DCO, GPG). These operate inside the repo's trust perimeter:
  # their actions are gated by workflow permissions / App scope and fully
  # audited via workflow logs. Substring matching on "[bot]" is intentionally
  # avoided — an attacker can create commits authored by "evil[bot]@foo.com".
  # Match is by GitHub login (.author.login), not email.
  #
  # NOTE: replace "lazyconfig-app[bot]" with the actual slug of your
  # GitHub App (whatever you named it when registering it). The slug is the
  # App name lowercased with spaces → hyphens.
  TRUSTED_BOTS: |
    github-actions[bot]
    lazyconfig-app[bot]
    dependabot[bot]

jobs:
  # ── PR-only checks ────────────────────────────────────────────────────────

  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/node-setup

      - name: Validate commit messages
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  dco:
    name: DCO Sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Bootstrap composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Check DCO sign-off on all commits
        uses: ./.github/actions/verify-commits
        with:
          mode: dco
          pr-number: ${{ github.event.pull_request.number }}
          trusted-bots: ${{ env.TRUSTED_BOTS }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  gpg:
    name: GPG Signatures
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Bootstrap composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Verify GPG signatures on all commits
        uses: ./.github/actions/verify-commits
        with:
          mode: gpg
          pr-number: ${{ github.event.pull_request.number }}
          trusted-bots: ${{ env.TRUSTED_BOTS }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Build + Lint + Test (delegated to reusable workflow) ──────────────────
  # Branch protection on main requires this to pass before any PR can land.
  # release.yml relies on that invariant — it does not re-validate before
  # publishing, since the SHA on main is already known to be green.

  test-suite:
    name: Test Suite
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read
    with:
      upload-artifacts: true

  # ── Coverage upload (fan-out per package) ────────────────────────────────
  # Adding a new package = one new entry in matrix.package. Each matrix leg
  # uploads exactly one lcov.info with its own flag so Codecov can attribute
  # coverage to the right package badge (?flag=<package>).

  coverage:
    name: Coverage / ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [test-suite]
    if: github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: [cli, eslint, jest, rollup]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: packages

      - name: Prefix lcov SF paths with package root
        run: sed -i 's|^SF:|SF:packages/${{ matrix.package }}/|' packages/${{ matrix.package }}/coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          codecov_yml_path: .github/codecov.yml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

  # ── Required gate ─────────────────────────────────────────────────────────
  # Set this job as the sole required status check in branch protection.
  # PR-only jobs (commitlint, dco, gpg) are skipped on push to main — skipped
  # counts as passing so the gate is not blocked on direct pushes.

  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [commitlint, dco, gpg, test-suite]
    if: always()
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done
          echo "All checks passed."
