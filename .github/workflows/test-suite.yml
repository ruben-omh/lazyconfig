name: Test Suite

# Reusable workflow consumed by ci.yml to validate PRs and pushes to main.
#
# Why a separate workflow instead of inline jobs in ci.yml?
#   - Keeps ci.yml focused on PR-specific concerns (DCO, GPG, commitlint).
#   - Makes the build/lint/test pipeline trivially callable from any future
#     workflow that needs the same validation (e.g. a release-candidate
#     workflow, or a manual workflow_dispatch smoke-test).
#
# Inputs let callers tweak behaviour without forking the file. They're
# currently all defaulted for ci.yml; the parameters exist so a future
# caller can opt out of artifact uploads or narrow the matrix.

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: >
          Whether to upload coverage and test-report artifacts. Disable for
          release validation runs where the artifacts aren't consumed.
        required: false
        type: boolean
        default: true
      node-versions:
        description: >
          JSON array of Node.js versions to test against. Default covers the
          repo's supported range. Release validation can narrow this if you
          want a faster path — but the default is to match CI exactly so
          release inherits the same guarantees.
        required: false
        type: string
        default: "[22, 24]"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/node-setup

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/node-setup

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Restore build outputs
        run: pnpm build

      - name: Lint
        run: pnpm lint

  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Test
        run: pnpm test

      - name: Upload coverage artifact
        if: inputs.upload-artifacts && matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          retention-days: 1

      - name: Upload test reports
        if: inputs.upload-artifacts && matrix.node-version == 22 && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: packages/*/reports/unit/test-results.xml
          retention-days: 7
