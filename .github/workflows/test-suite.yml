name: Test Suite

# Reusable workflow consumed by ci.yml to validate PRs and pushes to main.
#
# Why a separate workflow instead of inline jobs in ci.yml?
#   - Keeps ci.yml focused on PR-specific concerns (DCO, GPG, commitlint).
#   - Makes the build/lint/test pipeline trivially callable from any future
#     workflow that needs the same validation (e.g. a release-candidate
#     workflow, or a manual workflow_dispatch smoke-test).
#
# Inputs let callers tweak behaviour without forking the file. They're
# currently all defaulted for ci.yml; the parameters exist so a future
# caller can opt out of artifact uploads or narrow the matrix.
#
# Turbo cache: every job authenticates to Vercel Remote Cache via OIDC
# (vercel/setup-turborepo-remote-cache-action), so build outputs produced by
# the `build` job are restored by `lint`, `check-exports` and `test` — and by
# later runs on any branch with identical inputs. This replaces the previous
# actions/cache-based .turbo sharing.
#
# Requires: the caller job grants `id-token: write` (a called workflow cannot
# exceed its caller's permissions), a Turborepo CLI OIDC policy on Vercel for
# this repository, and the TURBO_TEAM repository variable.

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: >
          Whether to upload coverage and test-report artifacts. Disable for
          release validation runs where the artifacts aren't consumed.
        required: false
        type: boolean
        default: true
      node-versions:
        description: >
          JSON array of Node.js versions to test against. Default covers the
          repo's supported range. Release validation can narrow this if you
          want a faster path — but the default is to match CI exactly so
          release inherits the same guarantees.
        required: false
        type: string
        default: "[22, 24]"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      # PRs from forks (and other runs without an OIDC token) cannot
      # authenticate; continue-on-error lets turbo fall back to a local-only
      # cache instead of failing the build.
      - name: Set up Turborepo Remote Cache
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - name: Set up Turborepo Remote Cache
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # `lint` is plain `eslint .` (not a turbo task), so dist/ of workspace
      # deps must be restored explicitly for type-aware rules to resolve them.
      - name: Restore build outputs
        run: pnpm build

      - name: Lint
        run: pnpm lint

  check-exports:
    name: Check Exports
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - name: Set up Turborepo Remote Cache
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      # check:exports dependsOn build (turbo.json), so turbo restores each
      # package's dist/ from the Remote Cache before validating it — no
      # separate build step needed. Packages without a check:exports script
      # are simply not validated here; this job never publishes.
      - name: Check exports
        run: pnpm check:exports

  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Turborepo Remote Cache
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Test
        run: pnpm test

      - name: Upload coverage artifact
        if: inputs.upload-artifacts && matrix.node-version == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          retention-days: 1

      - name: Upload test reports
        if: inputs.upload-artifacts && matrix.node-version == 22 && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: packages/*/reports/unit/test-results.xml
          retention-days: 7
