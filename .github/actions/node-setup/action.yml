name: Setup
description: >
  Sets up pnpm and Node.js and installs dependencies. Consolidates the
  repeated bootstrap pattern across all jobs. Requires actions/checkout
  to have already run in the job before this action is used.

inputs:
  node-version:
    required: false
    default: "22"
    description: Node.js version to use.

  registry-url:
    required: false
    default: ""
    description: npm registry URL. Required for jobs that publish packages.

  install:
    required: false
    default: "true"
    description: Whether to run pnpm install --frozen-lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
